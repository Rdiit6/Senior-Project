name: CI

# MindMeter CI/CD pipeline
# - PRs to `dev` and `main` trigger lint + build checks
# - Push to `main` additionally deploys to Azure (requires AZURE_CREDENTIALS secret)
# - Path filters skip jobs when the relevant folder didn't change

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  lint-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Lint frontend
        run: |
          echo "TODO(FE lead): npm ci && npm run lint"
          echo "Stack decision pending — placeholder job so PRs still show the pipeline shape."

  lint-backend:
    name: Backend lint + test
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mindmeter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit + integration tests (real PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mindmeter_test

  build-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build check
        run: |
          echo "TODO: build both sides once the stack is locked."
          echo "Frontend changed: ${{ needs.detect-changes.outputs.frontend }}"
          echo "Backend changed:  ${{ needs.detect-changes.outputs.backend }}"

  deploy-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-check]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure
        run: |
          echo "TODO: azure/login@v2 + deploy step once AZURE_CREDENTIALS is set in repo secrets."
          echo "Blocked by design until the department Azure account is provisioned."
