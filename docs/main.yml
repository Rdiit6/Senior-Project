name: MindMeter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── JOB 1: Always runs ─────────────────────────────────────────
  # Lints all Markdown documentation (PRD, README, /docs pages).
  # Keeps the GitHub Pages content and repo docs error-free.
  lint-docs:
    name: Lint Markdown documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"

